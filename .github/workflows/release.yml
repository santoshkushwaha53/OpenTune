name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Refuse catalog audio in the tree
        run: |
          if git ls-files | grep -Ei '\.(mp3|m4a|flac|ogg|wav|aac)$'; then
            echo "Audio files must not ship in an OpenTune release"
            exit 1
          fi

      - name: Build API image (no push, no media layer)
        run: docker build -t opentune-api:"${GITHUB_REF_NAME}" ./backend

      - name: Notes from CHANGELOG
        id: notes
        run: python3 scripts/release_notes.py > /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "OpenTune ${GITHUB_REF_NAME#v}" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
