# OpenTune API on Render. PostgreSQL is Neon — do not add a Render Postgres
# or object-storage disk. Audio stays on provider URLs / the user device.
services:
  - type: web
    name: opentune-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OPERATOR_TOKEN
        sync: false
      - key: JAMENDO_CLIENT_ID
        sync: false
      - key: AUDIUS_API_KEY
        sync: false
      - key: INTERNET_ARCHIVE_ENABLED
        value: "true"
